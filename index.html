<!doctype html>

    <link rel="icon" href="/favicon.ico" />

    <title>เอกสาร</title>
    <!--
      Grist plugin API, served from our own Grist instance rather than
      docs.getgrist.com so the widget carries no external runtime dependency.
      Point VITE_GRIST_PLUGIN_API elsewhere at build time to override.
      Shared links (#d=...) still render if this script never loads.
    -->
    <script src="%VITE_GRIST_PLUGIN_API%"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
